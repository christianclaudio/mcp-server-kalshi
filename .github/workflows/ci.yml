name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]
  # Merges made by dependabot-automerge.yml use GITHUB_TOKEN, and pushes made
  # with GITHUB_TOKEN don't trigger push workflows, so the push trigger above
  # misses them. The weekly run tests main itself on Sunday afternoon Eastern,
  # after the Sunday morning Dependabot run (.github/dependabot.yml), and is the
  # only scheduled run of the drift-check job (manual dispatch also runs it);
  # schedule runs only on the default branch.
  # timezone keeps it at 15:17 Eastern through daylight saving changes. The minute
  # is off the hour to avoid peak scheduler load.
  schedule:
    - cron: '17 15 * * 0'
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the package version comes from the git tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Black format check
        run: uv run black --check src tests
      - name: Mypy strict
        run: uv run mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the package version comes from the git tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Unit tests + 100% coverage
        run: uv run pytest --cov=src/mcp_server_kalshi --cov-report=term-missing --cov-fail-under=100 -v

  contract:
    name: Tool contract verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the package version comes from the git tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Verify tool contracts and annotations
        run: uv run python scripts/check_tool_contract.py

  openapi-drift:
    name: OpenAPI drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the package version comes from the git tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Check client paths against Kalshi OpenAPI spec
        run: uv run python scripts/check_openapi_drift.py

  build:
    name: Build and package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the package version comes from the git tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Build sdist and wheel
        run: uv run python -m build
      - name: Reject fallback and untagged versions
        run: uv run python scripts/check_version.py
      - name: Twine check
        run: uv run twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14

  docker-build:
    name: Container builder CA floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mcp-server-ci:test
      - name: Builder fails below the ca-certificates floor
        # Raising CA_CERTIFICATES_FLOOR above any real Debian version makes the installed
        # package older than the floor, whatever version the base image or trixie-security
        # ships, so this is deterministic. The build must fail at the builder's floor check,
        # with its message, and before the pip bootstrap step starts.
        run: |
          set +e
          docker build --target builder --progress=plain \
            --build-arg CA_CERTIFICATES_FLOOR=99991231 . > ca-floor.log 2>&1
          status=$?
          set -e
          cat ca-floor.log
          if [ "$status" -eq 0 ]; then
            echo "::error::builder built with a ca-certificates floor above the installed version"
            exit 1
          fi
          if ! grep -q "is older than the floor 99991231" ca-floor.log; then
            echo "::error::builder failed, but not at the ca-certificates floor check"
            exit 1
          fi
          if grep -q -- "--require-hashes" ca-floor.log; then
            echo "::error::the pip bootstrap step started before the ca-certificates floor check failed"
            exit 1
          fi
          echo "Builder stops at the ca-certificates floor check before any pip step"

  conformance:
    name: MCP Protocol Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the package version comes from the git tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Run MCP conformance suite
        run: ./scripts/check_conformance.sh

  drift-check:
    name: Check OpenAPI Drift
    # Scheduled and manual runs only; pushes and pull requests skip it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Only this job can open issues. It opens one when the drift scan runs on main and
    # finds drift or exits with an error; a failed setup step fails the run without
    # one.
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the package version comes from the git tag.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Newest uv that meets pyproject.toml's [tool.uv] required-version (>=0.13.4, from
          # FastMCP's October 2026 certificate authority incident notice).
          version-file: "pyproject.toml"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      # Capture the exit code explicitly so the issue step (main only) keys on the drift
      # check's own result rather than on any earlier step failing.
      - name: Run drift detection
        id: drift
        run: |
          set +e
          uv run python scripts/check_openapi_drift.py 2>&1 | tee drift_results.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "check_openapi_drift.py exited $rc"
      - name: Create forge-todo issue
        if: steps.drift.outputs.rc != '0' && github.ref == 'refs/heads/main'
        env:
          DRIFT_RC: ${{ steps.drift.outputs.rc }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const rc = process.env.DRIFT_RC;
            const out = fs.existsSync('drift_results.txt') ? fs.readFileSync('drift_results.txt', 'utf8') : '';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // check_openapi_drift.py prints this line only right before it returns 1
            // for a real drift. Exit 1 without it (spec fetch failure, uncaught
            // exception) or any other code is a failed run, not a drift result.
            const drift = rc === '1' && out.includes('[!] OpenAPI drift check FAILED.');
            const title = drift
              ? 'Kalshi OpenAPI drift: client routes or parameters no longer match the spec'
              : `Kalshi drift monitor failed (exit ${rc})`;
            const lead = drift
              ? 'The scheduled drift monitor found client calls in `KalshiAPIClient` that are missing from, or deprecated in, `https://docs.kalshi.com/openapi.yaml`. Update the client routes or `scripts/drift_allowlist.txt`.'
              : 'The scheduled drift monitor did not produce a drift result: `scripts/check_openapi_drift.py` failed before finishing (for example, the spec could not be fetched). Re-run the workflow before treating this as drift.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['forge-todo'],
              body: `${lead}\n\nRun: ${run}\n\n\`\`\`\n${out.slice(-60000)}\n\`\`\`\n`,
            });
      - name: Fail the run
        if: steps.drift.outputs.rc != '0'
        env:
          DRIFT_RC: ${{ steps.drift.outputs.rc }}
        run: |
          echo "::error::check_openapi_drift.py exited ${DRIFT_RC}"
          exit 1
